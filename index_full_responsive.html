/* ============================================================
   GEO UTILITIES
============================================================ */
function polygonAreaM2(coords) {
  if (!coords || coords.length < 3) return 0;
  const R = 6378137; let area = 0;
  for (let i = 0; i < coords.length; i++) {
    const [lat1, lng1] = coords[i];
    const [lat2, lng2] = coords[(i + 1) % coords.length];
    area += (lng2 - lng1) * Math.PI / 180 * (2 + Math.sin(lat1 * Math.PI / 180) + Math.sin(lat2 * Math.PI / 180));
  }
  return Math.abs(area * R * R / 2);
}
const computeHa = coords => +(polygonAreaM2(coords) / 10000).toFixed(2);

/* ============================================================
   SCORING ENGINE (pure functions)
============================================================ */
function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return Math.abs(h);
}

function envForField(field) {
  if (!field) return BASE_ENV;
  const seed = hashCode(field.id);
  const offset = (seed % 100) / 100;
  const tempDelta = +((offset - 0.5) * 3).toFixed(2);
  const rainFactor = 0.7 + offset * 0.6;
  const soilDelta = (offset - 0.5) * 0.06;
  const ndviDelta = (offset - 0.5) * 0.10;
  const fieldMeta = { fieldContext: field.name };

  const tempSeries = arr => arr.map(v => +(v + tempDelta).toFixed(1));
  return {
    temperature: {
      ...BASE_ENV.temperature,
      avg: tempSeries(BASE_ENV.temperature.avg),
      min: tempSeries(BASE_ENV.temperature.min),
      max: tempSeries(BASE_ENV.temperature.max),
      headline: +(BASE_ENV.temperature.headline + tempDelta).toFixed(1),
      meta: { ...BASE_ENV.temperature.meta, ...fieldMeta },
    },
    rainfall: {
      ...BASE_ENV.rainfall,
      values: BASE_ENV.rainfall.values.map(v => +(v * rainFactor).toFixed(1)),
      headline: +(BASE_ENV.rainfall.headline * rainFactor).toFixed(1),
      meta: { ...BASE_ENV.rainfall.meta, ...fieldMeta },
    },
    soil: {
      ...BASE_ENV.soil,
      values: BASE_ENV.soil.values.map(v => +(v + soilDelta).toFixed(3)),
      headline: +(BASE_ENV.soil.headline + soilDelta).toFixed(3),
      meta: { ...BASE_ENV.soil.meta, ...fieldMeta },
    },
    ndvi: {
      ...BASE_ENV.ndvi,
      values: BASE_ENV.ndvi.values.map(v => +Math.max(0, Math.min(1, v + ndviDelta)).toFixed(2)),
      headline: +Math.max(0, Math.min(1, BASE_ENV.ndvi.headline + ndviDelta)).toFixed(2),
      meta: { ...BASE_ENV.ndvi.meta, ...fieldMeta },
    },
  };
}

function computeWeights(goals) {
  const total = Object.values(goals).reduce((a, b) => a + b, 0) || 1;
  const g = {}; Object.keys(goals).forEach(k => { g[k] = goals[k] / total; });
  const raw = {};
  CRITERIA.forEach(c => { raw[c.key] = g[c.goal] || 0; });
  const sum = Object.values(raw).reduce((a, b) => a + b, 0) || 1;
  Object.keys(raw).forEach(k => { raw[k] = raw[k] / sum; });
  return raw;
}

// Evaluate active hard/soft constraints against strategy.requires
function evaluateConstraints(strategy, activeConstraints) {
  const violations = [];
  const warnings = [];
  CONSTRAINTS_DEF.forEach(cd => {
    if (!activeConstraints[cd.key]) return;
    const th = cd.threshold;
    const value = strategy.requires[th.field];
    let fails = false;
    if (th.max !== undefined && typeof value === 'number' && value > th.max) fails = true;
    if (th.max !== undefined && typeof value === 'boolean' && th.max === false && value === true) fails = true;
    if (th.min !== undefined && typeof value === 'number' && value < th.min) fails = true;
    if (fails) {
      const reason = `${value} vs ${th.max !== undefined ? '≤' + th.max : '≥' + th.min}`;
      const entry = { key: cd.key, label: cd.label, labelAr: cd.labelAr, reason, hard: cd.hard };
      if (cd.hard) violations.push(entry); else warnings.push(entry);
    }
  });
  return { violations, warnings, feasible: violations.length === 0 };
}

// Compute criterion scores for a strategy adjusted by field context + simulation
function computeStrategyScores(strategy, field, sim) {
  const s = { ...strategy.baseScores };
  const clamp = (v, lo = 1, hi = 10) => +Math.max(lo, Math.min(hi, v)).toFixed(2);

  if (field) {
    if (field.irrigation === 'Drip')    s.waterEfficiency = clamp(s.waterEfficiency + 0.8);
    if (field.irrigation === 'Furrow')  s.waterEfficiency = clamp(s.waterEfficiency - 0.6);
    if (field.soil === 'Sandy' || field.soil === 'Sandy loam') s.soilSuitability = clamp(s.soilSuitability - 1);
    if (field.soil === 'Clay loam' && strategy.id === 'C') s.soilSuitability = clamp(s.soilSuitability + 0.8);
    if (field.season && field.season.includes('Summer') && strategy.id === 'A') s.climateSuitability = clamp(s.climateSuitability - 0.8);
  }

  if (sim) {
    // Temperature stress: hotter → low-resilience strategies suffer, resilient ones gain
    if (sim.temp !== 0) {
      const t = sim.temp / 4;
      if (strategy.id === 'A') s.climateResilience = clamp(s.climateResilience - t * 1.5);
      if (strategy.id === 'B') s.climateResilience = clamp(s.climateResilience - t * 0.4);
      if (strategy.id === 'C') s.climateResilience = clamp(s.climateResilience + t * 0.3);
    }
    // Water stress: less water → high-requirement strategies suffer on water efficiency
    if (sim.water !== 0) {
      const w = sim.water / 20; // -2 .. +1.5
      const stress = -w;
      const impact = -stress * (strategy.requires.waterLevel / 10) * 2.5;
      s.waterEfficiency = clamp(s.waterEfficiency + impact);
      if (strategy.id === 'B') s.potentialReturn = clamp(s.potentialReturn + stress * 0.3);
    }
    // Input price: cost efficiency suffers, more for high-input strategies
    if (sim.inputPrice !== 0) {
      const p = sim.inputPrice / 20; // -1 .. +2
      const impact = -p * (strategy.id === 'A' ? 0.7 : strategy.id === 'C' ? 0.9 : 0.6);
      s.costEfficiency = clamp(s.costEfficiency + impact);
    }
    // Market price: potential return responds
    if (sim.marketPrice !== 0) {
      const m = sim.marketPrice / 20;
      s.potentialReturn = clamp(s.potentialReturn + m * 1.2);
    }
    // Rainfall: extra rain helps soil moisture users, hurts water-resilient advantage
    if (sim.rain !== 0) {
      const r = sim.rain / 40; // -1.25 .. +1.5
      if (strategy.id === 'A') s.waterEfficiency = clamp(s.waterEfficiency + r * 0.6);
      if (strategy.id === 'B') s.waterEfficiency = clamp(s.waterEfficiency - r * 0.3);
      s.climateResilience = clamp(s.climateResilience + r * 0.2);
    }
  }

  return s;
}

function evaluateStrategies(field, weights, constraints, sim) {
  const results = STRATEGIES.map(strategy => {
    const { violations, warnings, feasible } = evaluateConstraints(strategy, constraints);
    const scores = computeStrategyScores(strategy, field, sim);

    const breakdown = CRITERIA.map(c => {
      const raw = scores[c.key] || 0;
      const norm = raw / 10;
      const weight = weights[c.key] || 0;
      const contribution = norm * weight * 10;
      return { ...c, raw, norm, weight, contribution };
    }).sort((a, b) => b.contribution - a.contribution);

    const total = +breakdown.reduce((sum, b) => sum + b.contribution, 0).toFixed(2);

    const missing = [];
    if (!field) { missing.push('field not selected'); }
    else {
      if (!field.soil) missing.push('soil type');
      if (!field.irrigation) missing.push('irrigation method');
      if (!field.crop) missing.push('crop type');
    }

    let confidence = strategy.confidence;
    if (missing.length > 0) confidence = Math.max(0.3, +(confidence - 0.08 * missing.length).toFixed(2));

    return { ...strategy, scores, breakdown, total, feasible, violations, warnings, missing, confidence, finalScore: feasible ? total : null };
  });

  return results.sort((a, b) => {
    if (a.feasible && !b.feasible) return -1;
    if (!a.feasible && b.feasible) return 1;
    return b.total - a.total;
  });
}

/* ============================================================
   CHARTS
============================================================ */
function ChartFrame({ children, height = 180, className = '' }) {
  return <div className={`w-full ${className}`} style={{ height }}>{children}</div>;
}

function LineChart({ labels, series, height = 180 }) {
  const W = 600, H = height, P = { l: 34, r: 10, t: 12, b: 22 };
  const all = series.flatMap(s => s.values);
  if (!all.length) return <ChartFrame height={height}><div className="h-full grid place-items-center text-muted text-xs">No data</div></ChartFrame>;
  const min = Math.min(...all), max = Math.max(...all);
  const pad = (max - min) * 0.1 || 1;
  const lo = min - pad, hi = max + pad;
  const x = i => P.l + (i / Math.max(1, labels.length - 1)) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = 4;
  return (
    <ChartFrame height={height}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="w-full h-full">
        {Array.from({ length: ticks + 1 }).map((_, i) => {
          const v = lo + (hi - lo) * (i / ticks);
          return <g key={i}>
            <line x1={P.l} x2={W - P.r} y1={y(v)} y2={y(v)} stroke="#E1E8DF" strokeWidth="1" />
            <text x={P.l - 6} y={y(v) + 3} textAnchor="end" fontSize="9" fill="#6B776F">{v.toFixed(1)}</text>
          </g>;
        })}
        {labels.map((l, i) => i % Math.ceil(labels.length / 6) === 0 && (
          <text key={l + i} x={x(i)} y={H - 6} textAnchor="middle" fontSize="9" fill="#6B776F">{l}</text>
        ))}
        {series.map((s, si) => {
          const pts = s.values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
          return <g key={si}>
            {s.fill && <polygon points={`${x(0)},${H - P.b} ${pts} ${x(labels.length - 1)},${H - P.b}`} fill={s.color} opacity="0.10" />}
            <polyline points={pts} fill="none" stroke={s.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" strokeDasharray={s.dash || ''} />
            {s.values.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r="2" fill={s.color} />)}
          </g>;
        })}
      </svg>
    </ChartFrame>
  );
}

function BarChart({ labels, values, color = '#477A5C', height = 180 }) {
  const W = 600, H = height, P = { l: 34, r: 10, t: 12, b: 22 };
  const max = Math.max(...values, 1);
  const gap = (W - P.l - P.r) / values.length;
  const bw = gap * 0.62;
  const y = v => P.t + (1 - v / max) * (H - P.t - P.b);
  return (
    <ChartFrame height={height}>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-full">
        {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
          <line key={i} x1={P.l} x2={W - P.r} y1={y(max * f)} y2={y(max * f)} stroke="#E1E8DF" />
        ))}
        {values.map((v, i) => (
          <g key={i}>
            <rect x={P.l + i * gap + (gap - bw) / 2} y={y(v)} width={bw} height={H - P.b - y(v)} rx="3" fill={color} opacity={0.85} />
            <text x={P.l + i * gap + gap / 2} y={H - 6} textAnchor="middle" fontSize="9" fill="#6B776F">{labels[i]}</text>
          </g>
        ))}
      </svg>
    </ChartFrame>
  );
}

function RadarChart({ axes, series, size = 240 }) {
  const cx = size / 2, cy = size / 2, R = size / 2 - 30;
  const n = axes.length;
  const angle = i => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, v) => {
    const r = (v / 10) * R;
    return [cx + Math.cos(angle(i)) * r, cy + Math.sin(angle(i)) * r];
  };
  return (
    <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full">
      {[2, 4, 6, 8, 10].map(ring => (
        <polygon key={ring} points={axes.map((_, i) => pt(i, ring).join(',')).join(' ')} fill="none" stroke="#E1E8DF" strokeWidth="1" />
      ))}
      {axes.map((a, i) => {
        const [x, y] = pt(i, 10);
        return <g key={a.key}>
          <line x1={cx} y1={cy} x2={x} y2={y} stroke="#E1E8DF" />
          <text x={pt(i, 12)[0]} y={pt(i, 12)[1]} fontSize="8" fill="#6B776F" textAnchor="middle" dominantBaseline="middle">{a.short}</text>
        </g>;
      })}
      {series.map((s, si) => (
        <polygon key={si} points={axes.map((a, i) => pt(i, s.values[a.key] || 0).join(',')).join(' ')}
          fill={s.color} fillOpacity="0.14" stroke={s.color} strokeWidth="2" />
      ))}
    </svg>
  );
}

/* ============================================================
   LEAFLET MAP
============================================================ */
function LeafletMap({ center = [30.41, 31.21], zoom = 14, polygons = [], onMapClick, onFieldClick, drawing = false, className = '', height = '100%' }) {
  const divRef = useRef(null);
  const mapRef = useRef(null);
  const layersRef = useRef([]);
  const drawRef = useRef(drawing); const clickRef = useRef(onMapClick); const fieldClickRef = useRef(onFieldClick);
  useEffect(() => { drawRef.current = drawing; }, [drawing]);
  useEffect(() => { clickRef.current = onMapClick; }, [onMapClick]);
  useEffect(() => { fieldClickRef.current = onFieldClick; }, [onFieldClick]);

  useEffect(() => {
    if (!divRef.current || mapRef.current) return;
    const m = L.map(divRef.current, { center, zoom, zoomControl: false, attributionControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(m);
    L.control.zoom({ position: 'bottomright' }).addTo(m);
    m.on('click', e => { if (drawRef.current && clickRef.current) clickRef.current([e.latlng.lat, e.latlng.lng]); });
    mapRef.current = m;
    setTimeout(() => m.invalidateSize(), 50);
    return () => { m.remove(); mapRef.current = null; };
  }, []);

  useEffect(() => {
    const m = mapRef.current; if (!m) return;
    layersRef.current.forEach(l => m.removeLayer(l)); layersRef.current = [];
    (polygons || []).forEach(p => {
      if (!p.coords || p.coords.length < 3) return;
      const poly = L.polygon(p.coords, {
        color: p.color || '#477A5C', weight: 2,
        fillColor: p.color || '#477A5C', fillOpacity: p.draft ? 0.12 : 0.20,
        dashArray: p.draft ? '5 5' : ''
      }).addTo(m);
      if (p.label) poly.bindTooltip(p.label, { permanent: true, direction: 'center', className: 'field-tooltip' });
      if (!p.draft && fieldClickRef.current && p.id) {
        poly.on('click', e => {
          L.DomEvent.stopPropagation(e);
          if (fieldClickRef.current) fieldClickRef.current(p.id);
        });
      }
      layersRef.current.push(poly);
    });
    if (polygons.length && !drawing) {
      const draft = polygons.find(p => p.draft);
      const target = draft || polygons[polygons.length - 1];
      if (target.coords.length >= 2) {
        try { m.fitBounds(L.latLngBounds(target.coords).pad(0.4)); } catch (e) {}
      }
    }
  }, [polygons, drawing]);

  return <div ref={divRef} className={className} style={{ height }} />;
}

        <div className="flex items-center justify-between mb-3">
          <div>
            <h3 className="font-bold text-ink text-sm">{t('section.envOverview')}</h3>
            {activeField && <div className="mt-0.5"><FieldContextBar field={activeField} compact /></div>}
          </div>
          <button onClick={() => setRoute('intel')} className="text-[11px] text-secondary font-semibold hover:underline">{t('intel.details')} →</button>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
          {[
            { key: 'temperature', icon: 'thermometer', color: '#E6A23C', label: t('intel.temperature'), data: env.temperature.avg, unit: env.temperature.unit, headline: env.temperature.headline },
            { key: 'rainfall', icon: 'rain', color: '#4A86B8', label: t('intel.rainfall'), data: env.rainfall.values, unit: env.rainfall.unit, headline: env.rainfall.headline },
            { key: 'soil', icon: 'droplet', color: '#477A5C', label: t('intel.soil'), data: env.soil.values, unit: env.soil.unit, headline: env.soil.headline },
            { key: 'ndvi', icon: 'leaf', color: '#163D32', label: t('intel.ndvi'), data: env.ndvi.values, unit: 'index', headline: env.ndvi.headline },
          ].map(c => {
            const vals = Array.isArray(c.data) ? c.data : [c.data];
            const W = 200, H = 56;
            const min = Math.min(...vals), max = Math.max(...vals);
            const pts = vals.map((v, i) => `${(i / Math.max(1, vals.length - 1)) * W},${H - ((v - min) / (max - min || 1)) * (H - 6) - 3}`).join(' ');
            return (
              <div key={c.key} className="rounded-xl border border-line p-3">
                <div className="flex items-center gap-1.5 text-[11px] font-semibold text-muted">
                  <Icon name={c.icon} size={12} style={{ color: c.color }} /> {c.label}
                </div>
                <div className="flex items-baseline gap-1 mt-1">
                  <span className="text-lg font-extrabold text-ink">{c.headline}</span>
                  <span className="text-[10px] text-muted">{c.unit}</span>
                </div>
                <svg viewBox={`0 0 ${W} ${H}`} className="w-full mt-1" style={{ height: 40 }}>
                  <polyline points={pts} fill="none" stroke={c.color} strokeWidth="1.6" />
                </svg>
              </div>
            );
          })}
        </div>
      </Card>

      <div className="grid lg:grid-cols-3 gap-4">
        <Card className="lg:col-span-2 p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{t('section.recent')}</h3>
          <div className="divide-y divide-line">
            {ACTIVITIES.map(a => (
              <div key={a.id} className="flex items-center gap-3 py-2.5">
                <div className="w-7 h-7 rounded-lg bg-lightsage text-forest grid place-items-center shrink-0"><Icon name={a.icon} size={13} /></div>
                <div className="min-w-0 flex-1">
                  <div className="text-[12px] text-ink truncate">{lang === 'ar' ? a.ar : a.en}</div>
                  <div className="text-[10px] text-muted">{lang === 'ar' ? a.timeAr : a.time}</div>
                </div>
              </div>
            ))}
          </div>
        </Card>
        <Card className="p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{t('action.continue')}</h3>
          <div className="space-y-2">
            {[{ label: t('nav.goals'), route: 'goals', icon: 'target' },
              { label: t('nav.strategy'), route: 'strategy', icon: 'compare' },
              { label: t('nav.simulator'), route: 'simulator', icon: 'flask' },
              { label: t('nav.reports'), route: 'reports', icon: 'file' }].map(x => (
              <button key={x.route} onClick={() => setRoute(x.route)}
                className="w-full flex items-center gap-2.5 p-2.5 rounded-lg border border-line hover:border-secondary hover:bg-lightsage/40 transition-colors text-start">
                <Icon name={x.icon} size={14} className="text-secondary" />
                <span className="text-xs font-semibold text-ink flex-1">{x.label}</span>
                <Icon name="chevronRight" size={12} className="text-muted" />
              </button>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

                <div className="min-w-0">
                  <div className="font-bold text-ink truncate">{lang === 'ar' ? f.nameAr : f.name}</div>
                  <div className="text-[11px] text-muted flex items-center gap-1 mt-0.5"><Icon name="map" size={10} /> {lang === 'ar' ? f.locationAr : f.location}</div>

                <Badge tone={statusTone(f.status)}>{statusLabel(f.status)}</Badge>

              <div className="grid grid-cols-3 gap-2 mb-3">
                <div><div className="text-[9px] uppercase text-muted font-semibold">{t('common.area')}</div><div className="text-sm font-bold text-ink">{totalHa} ha</div></div>

                <div><div className="text-[9px] uppercase text-muted font-semibold">{t('common.crop')}</div><div className="text-sm font-bold text-ink truncate">{mainCrop}</div></div>
              </div>
              <div className="text-[10px] text-muted mb-3">{t('common.updated')}: {f.updated}</div>

                <Button size="sm" variant="secondary" className="flex-1" onClick={() => { setActiveFarmId(f.id); setRoute('dashboard'); }}>{t('action.open')}</Button>
                <Button size="sm" variant="outline" onClick={() => { setActiveFarmId(f.id); setRoute('mapping'); }}><Icon name="edit" size={13} /></Button>
                <Button size="sm" variant="outline" onClick={() => setConfirmDel(f.id)}><Icon name="trash" size={13} className="text-danger" /></Button>
              </div>

        })}

      {confirmDel && (
        <div className="fixed inset-0 z-50 bg-deep/50 grid place-items-center p-4">

            <p className="text-sm text-muted mb-4">This removes the demo farm from your local session. It cannot be undone.</p>
            <div className="flex justify-end gap-2">
              <Button variant="outline" size="sm" onClick={() => setConfirmDel(null)}>{t('action.cancel')}</Button>
              <Button variant="danger" size="sm" onClick={() => { setFarms(fs => fs.filter(x => x.id !== confirmDel)); setConfirmDel(null); }}>{t('action.delete')}</Button>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   FARM MAPPING
============================================================ */
const emptyForm = () => ({
  name: '', crop: 'Wheat', cropAr: 'قمح', season: 'Winter 2025/26', seasonAr: 'شتاء 2025/26',
  irrigation: 'Furrow', irrigationAr: 'أخاديد', soil: 'Clay loam', soilAr: 'طينية طميية',
  plantingDate: '2025-11-15', notes: '',
});

const PALETTE = ['#4A86B8', '#477A5C', '#E6A23C', '#163D32', '#A8C3A0', '#D95C5C'];
function pickColor(existing) {
  const used = new Set(existing.map(f => f.color));
  return PALETTE.find(c => !used.has(c)) || PALETTE[existing.length % PALETTE.length];
}

function MappingPage({ farms, fields, setFields, activeFarmId, activeField, setActiveFieldId, setRoute }) {
  const { t, lang } = useT();
  const farmFields = fields.filter(f => f.farmId === activeFarmId);
  const [mode, setMode] = useState('idle'); // idle | draw | edit
  const [points, setPoints] = useState([]);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyForm());
  const [errors, setErrors] = useState({});
  const [flash, setFlash] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);

  const areaHa = useMemo(() => +(polygonAreaM2(points) / 10000).toFixed(2), [points]);
  const areaAc = +(areaHa * 2.471).toFixed(2);

  const onMapClick = useCallback(latlng => {
    if (mode === 'draw' || mode === 'edit') setPoints(p => [...p, latlng]);
  }, [mode]);

  const resetForm = () => { setForm(emptyForm()); setErrors({}); };
  const cancel = () => { setMode('idle'); setPoints([]); setEditingId(null); resetForm(); };

  const startDraw = () => {
    setMode('draw'); setPoints([]); setEditingId(null); resetForm();
  };

  const startEdit = f => {
    setMode('edit'); setPoints(f.coords.slice()); setEditingId(f.id);
    setForm({
      name: f.name, crop: f.crop, cropAr: f.cropAr, season: f.season, seasonAr: f.seasonAr,
      irrigation: f.irrigation, irrigationAr: f.irrigationAr, soil: f.soil, soilAr: f.soilAr,
      plantingDate: f.plantingDate, notes: f.notes,
    });
    setErrors({});
  };

  const undo = () => setPoints(p => p.slice(0, -1));
  const clearPoints = () => setPoints([]);

  const validate = () => {
    const errs = {};
    if (!form.name.trim()) errs.name = t('map.validationName');
    if (!form.crop || !form.soil || !form.irrigation) errs.meta = t('map.validationMeta');
    if (points.length < 3) errs.polygon = t('map.validationPolygon');
    return errs;
  };

  const finish = () => {
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    const data = {
      id: editingId || 'fld-' + Date.now(),
      farmId: activeFarmId,
      name: form.name.trim(), nameAr: form.name.trim(),
      color: editingId ? fields.find(f => f.id === editingId)?.color || pickColor(farmFields) : pickColor(farmFields),
      coords: points.slice(),
      crop: form.crop, cropAr: form.cropAr,
      season: form.season, seasonAr: form.seasonAr,
      irrigation: form.irrigation, irrigationAr: form.irrigationAr,
      soil: form.soil, soilAr: form.soilAr,
      plantingDate: form.plantingDate, notes: form.notes,
      areaHa,
      updatedAt: new Date().toISOString().slice(0, 10),
    };
    if (editingId) {
      setFields(fs => fs.map(f => f.id === editingId ? data : f));
      setFlash(t('map.fieldUpdated'));
    } else {
      setFields(fs => [...fs, data]);
      setFlash(t('map.fieldSaved'));
    }
    setActiveFieldId(data.id);
    setMode('idle'); setPoints([]); setEditingId(null); resetForm();
    setTimeout(() => setFlash(null), 2200);
  };

  const removeField = id => {
    setFields(fs => fs.filter(f => f.id !== id));
    if (activeField?.id === id) {
      const remaining = farmFields.filter(f => f.id !== id);
      setActiveFieldId(remaining[0]?.id || null);
    }
    setFlash(t('map.fieldDeleted'));
    setTimeout(() => setFlash(null), 2200);
    setConfirmDel(null);
  };

  const polygons = useMemo(() => {
    const list = farmFields.filter(f => f.id !== editingId).map(f => ({
      ...f, label: `${lang === 'ar' ? f.nameAr : f.name} · ${f.areaHa} ha`,
    }));
    if (points.length >= 1) {
      list.push({
        id: 'draft', coords: points, color: '#4A86B8', draft: true,
        label: points.length >= 3 ? `${areaHa.toFixed(2)} ha` : '',
      });
    }
    return list;
  }, [farmFields, points, areaHa, editingId, lang]);

  const metaLabel = {
    idle: t('map.modeIdle'),
    draw: `${t('map.modeDraw')} (${points.length})`,
    edit: `${t('map.modeEdit')} (${points.length})`,
  }[mode];

  const busy = mode === 'draw' || mode === 'edit';

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 className="text-xl md:text-2xl font-extrabold text-ink">{t('nav.mapping')}</h2>
          <p className="text-sm text-muted mt-0.5">
            {lang === 'ar' ? 'حدد موقع المزرعة وارسم حدود الحقول لحساب المساحة تلقائيًا.' : 'Choose a location, draw field boundaries, and calculate area automatically.'}
          </p>
        </div>
        <div className="flex items-center gap-2">
          <DataBadge />
          {flash && (
            <span className="inline-flex items-center gap-1 text-[11px] font-semibold text-secondary">
              <Icon name="check" size={12} /> {flash}
            </span>
          )}
        </div>
      </div>

      <div className="grid lg:grid-cols-3 gap-4">
        <Card className="lg:col-span-2 overflow-hidden">
          <div className="p-3 flex flex-wrap items-center gap-1.5 border-b border-line">
            {!busy && (
              <Button size="sm" variant="primary" onClick={startDraw} icon="polygon">{t('action.startDraw')}</Button>
            )}
            {busy && (
              <>
                <Button size="sm" variant="outline" onClick={undo} disabled={points.length === 0} icon="cornerUpLeft">{t('action.undo')}</Button>
                <Button size="sm" variant="outline" onClick={clearPoints} disabled={points.length === 0} icon="eraser">{t('action.clear')}</Button>
                <Button size="sm" variant="primary" onClick={finish} disabled={points.length < 3} icon="check">{t('action.finish')}</Button>
                <Button size="sm" variant="ghost" onClick={cancel} icon="x">{t('action.cancel')}</Button>
              </>
            )}
            <div className="ms-auto flex items-center gap-2 text-[11px] text-muted">
              <Icon name="info" size={12} />
              <span>{metaLabel}</span>
            </div>
          </div>
          <div className="p-3">
            <div className="rounded-xl overflow-hidden border border-line" style={{ height: 440 }}>
              <LeafletMap
                center={[30.41, 31.21]} zoom={14}
                polygons={polygons}
                drawing={busy}
                onMapClick={onMapClick}
                onFieldClick={mode === 'idle' ? id => setActiveFieldId(id) : null}
                height="100%" className="w-full h-full"
              />
            </div>
            {busy && (
              <div className="mt-2 flex flex-wrap items-center gap-3 text-xs bg-lightsage/60 rounded-lg px-3 py-2">
                <Icon name="weigh" size={14} className="text-forest" />
                <span className="font-semibold text-forest">{areaHa} ha</span>
                <span className="text-muted">≈ {areaAc} {t('common.acres')}</span>
                <span className="text-muted">·</span>
                <span className="text-muted">{points.length} {lang === 'ar' ? 'نقطة' : 'vertices'}</span>
                <DataBadge small />
              </div>
            )}
            {errors.polygon && (
              <div className="mt-2 text-[11px] text-danger flex items-center gap-1">
                <Icon name="alert" size={12} /> {errors.polygon}
              </div>
            )}
          </div>
        </Card>

        <div className="space-y-3">
          <Card className="p-4">
            <h3 className="font-bold text-ink text-sm mb-3 flex items-center gap-2">
              {mode === 'edit' ? t('action.editField') : t('action.saveField')}
              {mode === 'edit' && <Badge tone="info">{lang === 'ar' ? 'وضع التحرير' : 'Editing'}</Badge>}
            </h3>
            <div className="space-y-2.5">
              <label className="block">
                <span className="text-[10px] uppercase font-bold text-muted tracking-wide">{lang === 'ar' ? 'اسم الحقل' : 'Field name'} *</span>
                <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })}
                  placeholder={lang === 'ar' ? 'مثال: حقل أ' : 'e.g. Field A'}
                  className={`w-full mt-1 px-3 py-2 text-xs border rounded-lg focus:outline-none ${errors.name ? 'border-danger' : 'border-line focus:border-secondary'}`} />
                {errors.name && <span className="text-[10px] text-danger">{errors.name}</span>}
              </label>

              <div className="grid grid-cols-2 gap-2">
                <label className="block">
                  <span className="text-[10px] uppercase font-bold text-muted tracking-wide">{t('common.crop')} *</span>
                  <select value={form.crop}
                    onChange={e => { const c = CROP_OPTIONS.find(o => o.en === e.target.value); setForm({ ...form, crop: c.en, cropAr: c.ar }); }}
                    className="w-full mt-1 px-2 py-2 text-xs border border-line rounded-lg bg-white focus:outline-none">
                    {CROP_OPTIONS.map(c => <option key={c.en} value={c.en}>{lang === 'ar' ? c.ar : c.en}</option>)}
                  </select>
                </label>
                <label className="block">
                  <span className="text-[10px] uppercase font-bold text-muted tracking-wide">{t('common.soil')} *</span>
                  <select value={form.soil}
                    onChange={e => { const s = SOIL_OPTIONS.find(o => o.en === e.target.value); setForm({ ...form, soil: s.en, soilAr: s.ar }); }}
                    className="w-full mt-1 px-2 py-2 text-xs border border-line rounded-lg bg-white focus:outline-none">
                    {SOIL_OPTIONS.map(c => <option key={c.en} value={c.en}>{lang === 'ar' ? c.ar : c.en}</option>)}
                  </select>
                </label>
              </div>

              <label className="block">
                <span className="text-[10px] uppercase font-bold text-muted tracking-wide">{t('common.irrigation')} *</span>
                <select value={form.irrigation}
                  onChange={e => { const i = IRRIGATION_OPTIONS.find(o => o.en === e.target.value); setForm({ ...form, irrigation: i.en, irrigationAr: i.ar }); }}
                  className="w-full mt-1 px-2 py-2 text-xs border border-line rounded-lg bg-white focus:outline-none">
                  {IRRIGATION_OPTIONS.map(c => <option key={c.en} value={c.en}>{lang === 'ar' ? c.ar : c.en}</option>)}
                </select>
              </label>

              <div className="grid grid-cols-2 gap-2">
                <label className="block">
                  <span className="text-[10px] uppercase font-bold text-muted tracking-wide">{t('common.season')}</span>
                  <select value={form.season}
                    onChange={e => { const s = SEASON_OPTIONS.find(o => o.en === e.target.value); setForm({ ...form, season: s.en, seasonAr: s.ar }); }}
                    className="w-full mt-1 px-2 py-2 text-xs border border-line rounded-lg bg-white focus:outline-none">
                    {SEASON_OPTIONS.map(c => <option key={c.en} value={c.en}>{lang === 'ar' ? c.ar : c.en}</option>)}
                  </select>
                </label>
                <label className="block">
                  <span className="text-[10px] uppercase font-bold text-muted tracking-wide">{t('common.planting')}</span>
                  <input type="date" value={form.plantingDate} onChange={e => setForm({ ...form, plantingDate: e.target.value })}
                    className="w-full mt-1 px-2 py-2 text-xs border border-line rounded-lg focus:outline-none focus:border-secondary" />
                </label>
              </div>

              {errors.meta && <div className="text-[10px] text-danger flex items-center gap-1"><Icon name="alert" size={11} /> {errors.meta}</div>}

              <div className="flex items-center justify-between bg-lightsage/60 rounded-lg px-3 py-2 text-xs">
                <span className="text-muted">{t('common.area')}</span>
                <span className="font-bold text-forest">{areaHa} ha · {areaAc} ac</span>
              </div>

              <div className="flex gap-1.5">
                <Button className="flex-1" size="sm" onClick={finish} disabled={!busy || points.length < 3} icon="save">
                  {mode === 'edit' ? t('action.save') : t('action.saveField')}
                </Button>
                {busy && <Button size="sm" variant="ghost" onClick={cancel}>{t('action.cancel')}</Button>}
              </div>
            </div>
          </Card>

          <Card className="p-4">
            <h3 className="font-bold text-ink text-sm mb-2 flex items-center justify-between">
              <span>{t('common.fields')}</span>
              <span className="text-[10px] text-muted font-medium">{farmFields.length}</span>
            </h3>
            <div className="space-y-1.5 max-h-72 overflow-y-auto scroll-thin">
              {farmFields.length === 0 && <div className="text-[11px] text-muted py-2">{t('map.noFields')}</div>}
              {farmFields.map(f => (
                <div key={f.id} className={`p-2 rounded-lg border transition-all ${activeField?.id === f.id ? 'border-secondary bg-lightsage/40' : 'border-line'}`}>
                  <div className="flex items-center gap-2">
                    <button onClick={() => setActiveFieldId(f.id)} className="w-2.5 h-2.5 rounded-sm shrink-0" style={{ background: f.color }} aria-label="select" />
                    <button onClick={() => setActiveFieldId(f.id)} className="text-[11px] font-medium text-ink flex-1 truncate text-start">
                      {lang === 'ar' ? f.nameAr : f.name}
                    </button>
                    <button onClick={() => startEdit(f)} className="p-1 text-muted hover:text-forest" title={t('action.edit')}>
                      <Icon name="edit" size={12} />
                    </button>
                    <button onClick={() => setConfirmDel(f.id)} className="p-1 text-muted hover:text-danger" title={t('action.delete')}>
                      <Icon name="trash" size={12} />
                    </button>
                  </div>
                  <div className="text-[10px] text-muted ms-4.5 ps-0.5">

          </div>
          <div className="p-3 rounded-lg bg-lightsage/50">
            <div className="text-[10px] uppercase font-bold text-muted mb-1.5">{lang === 'ar' ? 'القيود النشطة' : 'Active constraints'}</div>
            <div className="flex flex-wrap gap-1">
              {CONSTRAINTS_DEF.filter(c => constraints[c.key]).map(c => (
                <span key={c.key} className={`text-[10px] px-1.5 py-0.5 rounded border font-medium ${c.hard ? 'bg-warn/10 border-warn/30 text-warn' : 'bg-white border-line text-forest'}`}>
                  {lang === 'ar' ? c.labelAr : c.label}

        </div>
      </Card>
    </div>

/* ============================================================
   STRATEGY COMPARISON
============================================================ */
function StrategyPage({ field, goals, constraints }) {
  const { t, lang } = useT();
  const weights = useMemo(() => computeWeights(goals), [goals]);
  const ranked = useMemo(() => evaluateStrategies(field, weights, constraints, null), [field, weights, constraints]);
  const [expanded, setExpanded] = useState(null);

  useEffect(() => {
    if (!expanded && ranked.length) setExpanded(ranked[0].id);
  }, [ranked, expanded]);

  const topFeasible = ranked.find(s => s.feasible);
  const expandedStrategy = ranked.find(s => s.id === expanded) || ranked[0];

  const equalW = useMemo(() => { const w = {}; CRITERIA.forEach(c => w[c.key] = 1 / CRITERIA.length); return w; }, []);
  const waterW = useMemo(() => {
    const w = {}; CRITERIA.forEach(c => w[c.key] = c.key === 'waterEfficiency' ? 0.4 : 0.6 / (CRITERIA.length - 1));
    return w;
  }, []);
  const rankEqual = useMemo(() => evaluateStrategies(field, equalW, constraints, null), [field, equalW, constraints]);
  const rankWater = useMemo(() => evaluateStrategies(field, waterW, constraints, null), [field, waterW, constraints]);

  const activeConstraints = CONSTRAINTS_DEF.filter(c => constraints[c.key]);

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 className="text-xl md:text-2xl font-extrabold text-ink">{t('strategy.title')}</h2>
          <p className="text-sm text-muted mt-0.5 max-w-2xl">{t('strategy.sub')}</p>
        </div>
        <DataBadge />
      </div>

      {field && (
        <Card className="p-3">
          <div className="text-[10px] uppercase font-bold text-muted tracking-wide mb-1">{t('strategy.fieldContext')}</div>
          <FieldContextBar field={field} />
        </Card>
      )}

      {!topFeasible && (
        <div className="rounded-xl border border-danger/30 bg-danger/5 p-3 flex items-start gap-2">
          <Icon name="alert" size={14} className="text-danger shrink-0 mt-0.5" />
          <p className="text-[11px] text-ink leading-relaxed">{t('strategy.noFeasible')}</p>
        </div>
      )}

      {activeConstraints.length > 0 && (
        <div className="rounded-xl border border-info/30 bg-info/5 p-3 flex items-start gap-2">
          <Icon name="info" size={14} className="text-info shrink-0 mt-0.5" />
          <div className="text-[11px] text-ink">
            <span className="font-bold">{lang === 'ar' ? 'القيود النشطة:' : 'Active constraints:'}</span>{' '}
            {activeConstraints.map(c => `${lang === 'ar' ? c.labelAr : c.label} (${c.hard ? t('goals.hard') : t('goals.soft')})`).join(' · ')}.
          </div>
        </div>
      )}

      <div className="grid md:grid-cols-3 gap-3">
        {ranked.map((s, idx) => {
          const isTop = s.feasible && s.id === topFeasible?.id;
          return (
            <Card key={s.id} className={`p-4 ${isTop ? 'ring-2 ring-secondary/50' : ''} ${!s.feasible ? 'opacity-90 bg-canvas' : ''}`}>
              <div className="flex items-start justify-between mb-2">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-lg grid place-items-center text-white font-extrabold" style={{ background: s.color }}>{s.id}</div>
                  <div>
                    <div className="font-bold text-ink text-[13px] leading-tight">{lang === 'ar' ? s.nameAr : s.name}</div>
                    <div className="text-[10px] text-muted">
                      {isTop ? t('strategy.topFeasible') : s.feasible ? `#${ranked.filter(x => x.feasible).indexOf(s) + 1}` : t('strategy.notRanked')}
                    </div>
                  </div>
                </div>
                {isTop && <Badge tone="success" icon="star">#1</Badge>}
                {!s.feasible && <Badge tone="danger" icon="alert">{t('strategy.infeasible')}</Badge>}
              </div>
              <p className="text-[11px] text-muted leading-relaxed mb-2">{lang === 'ar' ? s.descAr : s.desc}</p>

              {s.violations.length > 0 && (
                <div className="mb-2 rounded-lg border border-danger/30 bg-danger/5 p-2">
                  <div className="text-[9px] uppercase font-bold text-danger tracking-wide mb-0.5">{t('strategy.violates')}</div>
                  {s.violations.map(v => (
                    <div key={v.key} className="text-[10px] text-ink leading-snug">• {lang === 'ar' ? v.labelAr : v.label}</div>
                  ))}
                </div>
              )}

                <div className="mb-2 rounded-lg border border-warn/30 bg-warn/5 p-2">
                  <div className="text-[9px] uppercase font-bold text-warn tracking-wide mb-0.5">{lang === 'ar' ? 'تحذير' : 'Warning'}</div>
                  {s.warnings.map(v => (
                    <div key={v.key} className="text-[10px] text-ink leading-snug">• {lang === 'ar' ? v.labelAr : v.label}</div>
                  ))}
                </div>
              )}

              <div className="flex items-end justify-between mb-2">
                <div>
                  <div className="text-[9px] uppercase font-bold text-muted tracking-wide">{t('strategy.suitability')}</div>
                  <div className={`text-2xl font-extrabold ${s.feasible ? 'text-ink' : 'text-muted line-through'}`}>

              )}
            </Card>
          );
        })}
      </div>

      <div className="grid lg:grid-cols-5 gap-4">
        <Card className="lg:col-span-2 p-4">
          <h3 className="font-bold text-ink text-sm mb-2">{lang === 'ar' ? 'الملف التعريفي للمعايير' : 'Criterion Profile'}</h3>
          <div style={{ height: 260 }}>
            <RadarChart axes={CRITERIA.map(c => ({ ...c, short: (lang === 'ar' ? c.labelAr : c.label).slice(0, 9) }))}
              series={ranked.map(s => ({ ...s, values: s.scores }))} size={260} />
          </div>
          <div className="flex flex-wrap gap-2 justify-center mt-2">
            {ranked.map(s => (
              <span key={s.id} className={`flex items-center gap-1 text-[10px] ${s.feasible ? 'text-muted' : 'text-muted/60 line-through'}`}>
                <span className="w-2 h-2 rounded-sm" style={{ background: s.color }} />{s.id}

function SimulatorPage({ field, goals, constraints, simulation, setSimulation }) {
  const { t, lang } = useT();
  const weights = useMemo(() => computeWeights(goals), [goals]);
  const baselineResults = useMemo(() => evaluateStrategies(field, weights, constraints, null), [field, weights, constraints]);
  const modifiedResults = useMemo(() => evaluateStrategies(field, weights, constraints, simulation), [field, weights, constraints, simulation]);

  const baseline = { temp: 21.4, rain: 27.7, water: 1.0, inputPrice: 1.0, marketPrice: 1.0 };
  const modified = {
    temp: +(baseline.temp + simulation.temp).toFixed(1),
    rain: +(baseline.rain * (1 + simulation.rain / 100)).toFixed(1),
    water: +(baseline.water * (1 + simulation.water / 100)).toFixed(2),
    inputPrice: +(baseline.inputPrice * (1 + simulation.inputPrice / 100)).toFixed(2),
    marketPrice: +(baseline.marketPrice * (1 + simulation.marketPrice / 100)).toFixed(2),
  };
  const hasChanges = Object.values(simulation).some(v => v !== 0);

  const sliders = [
    { key: 'temp', label: lang === 'ar' ? 'الحرارة' : 'Temperature', min: -4, max: 6, step: 0.5, unit: '°C' },
    { key: 'rain', label: lang === 'ar' ? 'الأمطار' : 'Rainfall', min: -50, max: 60, step: 5, unit: '%' },
    { key: 'water', label: lang === 'ar' ? 'توفر المياه' : 'Water Availability', min: -40, max: 30, step: 5, unit: '%' },
    { key: 'inputPrice', label: lang === 'ar' ? 'أسعار المدخلات' : 'Input Prices', min: -20, max: 40, step: 5, unit: '%' },
    { key: 'marketPrice', label: lang === 'ar' ? 'أسعار السوق' : 'Crop Market Prices', min: -30, max: 30, step: 5, unit: '%' },
  ];

  const reset = () => setSimulation({ temp: 0, rain: 0, water: 0, inputPrice: 0, marketPrice: 0 });

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 className="text-xl md:text-2xl font-extrabold text-ink">{t('sim.title')}</h2>
          <p className="text-sm text-muted mt-0.5 max-w-2xl">{t('sim.sub')}</p>
        </div>
        <div className="flex items-center gap-2">
          <DataBadge />
          <Button variant="outline" size="sm" icon="rotate" onClick={reset} disabled={!hasChanges}>{t('action.reset')}</Button>
        </div>
      </div>

      {field && <Card className="p-3"><FieldContextBar field={field} /></Card>}

      <div className="rounded-xl border border-warn/30 bg-warn/5 p-3 flex items-start gap-2">
        <Icon name="alert" size={14} className="text-warn shrink-0 mt-0.5" />
        <p className="text-[11px] text-ink leading-relaxed">{t('sim.note')}</p>
      </div>

      <div className="grid lg:grid-cols-3 gap-4">
        <Card className="p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{lang === 'ar' ? 'متغيرات السيناريو' : 'Scenario Variables'}</h3>
          <div className="space-y-4">
            {sliders.map(s => (
              <div key={s.key}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[11px] font-semibold text-ink">{s.label}</span>
                  <span className={`text-[11px] font-bold ${simulation[s.key] === 0 ? 'text-muted' : simulation[s.key] > 0 ? 'text-danger' : 'text-info'}`}>
                    {simulation[s.key] > 0 ? '+' : ''}{simulation[s.key]}{s.unit}
                  </span>
                </div>
                <input type="range" min={s.min} max={s.max} step={s.step} value={simulation[s.key]}
                  onChange={e => setSimulation({ ...simulation, [s.key]: +e.target.value })} className="w-full" />
              </div>
            ))}
          </div>
        </Card>

        <div className="lg:col-span-2 space-y-3">
          <Card className="p-4">
            <h3 className="font-bold text-ink text-sm mb-3">{t('sim.baseline')} vs {t('sim.modified')}</h3>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {[
                { label: lang === 'ar' ? 'الحرارة' : 'Temperature', b: baseline.temp, m: modified.temp, u: '°C' },
                { label: lang === 'ar' ? 'الأمطار' : 'Rainfall', b: baseline.rain, m: modified.rain, u: 'mm' },
                { label: lang === 'ar' ? 'المياه' : 'Water', b: baseline.water, m: modified.water, u: '×' },
                { label: lang === 'ar' ? 'المدخلات' : 'Inputs', b: baseline.inputPrice, m: modified.inputPrice, u: '×' },
                { label: lang === 'ar' ? 'السوق' : 'Market', b: baseline.marketPrice, m: modified.marketPrice, u: '×' },
              ].map(x => {
                const diff = x.m - x.b;
                return (
                  <div key={x.label} className="p-2.5 rounded-lg border border-line">
                    <div className="text-[9px] uppercase font-bold text-muted">{x.label}</div>
                    <div className="flex items-baseline gap-1.5 mt-1">
                      <span className="text-xs text-muted line-through">{x.b}{x.u}</span>
                      <span className="text-sm font-bold text-ink">{x.m}{x.u}</span>
                    </div>
                    <div className={`text-[10px] font-semibold ${diff > 0 ? 'text-danger' : diff < 0 ? 'text-info' : 'text-muted'}`}>
                      {diff === 0 ? '—' : `${diff > 0 ? '+' : ''}${diff.toFixed(2)}`}
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>

          <Card className="p-4">
            <h3 className="font-bold text-ink text-sm mb-2">{t('sim.scoreChange')}</h3>
            {!hasChanges && (
              <p className="text-[11px] text-muted italic py-2">{t('sim.noChanges')}</p>
            )}
            {hasChanges && (
              <div className="space-y-1.5">
                {modifiedResults.map((s, i) => {
                  const base = baselineResults.find(b => b.id === s.id);
                  const delta = +(s.total - base.total).toFixed(2);
                  const baseRank = base.feasible ? baselineResults.filter(x => x.feasible).indexOf(base) + 1 : '—';
                  const modRank = s.feasible ? modifiedResults.filter(x => x.feasible).indexOf(s) + 1 : '—';
                  const rankDelta = (typeof baseRank === 'number' && typeof modRank === 'number') ? (baseRank - modRank) : 0;
                  return (
                    <div key={s.id} className={`flex items-center gap-2 text-[11px] ${!s.feasible ? 'opacity-60' : ''}`}>
                      <span className={`w-5 h-5 rounded text-[10px] font-bold text-white grid place-items-center shrink-0 ${!s.feasible ? 'opacity-50' : ''}`} style={{ background: s.color }}>
                        {s.feasible ? modRank : '—'}
                      </span>
                      <span className={`font-medium text-ink flex-1 truncate ${!s.feasible ? 'line-through' : ''}`}>{lang === 'ar' ? s.nameAr : s.name}</span>
                      <div className="w-24 h-1.5 rounded-full bg-lightsage overflow-hidden">
                        <div className="h-full rounded-full" style={{ width: (s.total * 10) + '%', background: s.color }} />
                      </div>
                      <span className="font-bold text-ink w-8 text-end">{s.total.toFixed(1)}</span>
                      <span className={`w-10 text-end text-[10px] font-bold ${delta > 0 ? 'text-secondary' : delta < 0 ? 'text-danger' : 'text-muted'}`}>
                        {delta === 0 ? '—' : `${delta > 0 ? '+' : ''}${delta}`}
                      </span>
                      <span className={`w-8 text-end text-[10px] font-bold ${rankDelta > 0 ? 'text-secondary' : rankDelta < 0 ? 'text-danger' : 'text-muted'}`}>
                        {rankDelta === 0 ? '—' : rankDelta > 0 ? `↑${rankDelta}` : `↓${-rankDelta}`}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}
          </Card>
        </div>
      </div>

      {hasChanges && (
        <Card className="p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{t('sim.whyChanged')}</h3>
          <div className="space-y-2.5">
            {modifiedResults.map(s => {
              const base = baselineResults.find(b => b.id === s.id);
              const changes = CRITERIA.map(c => ({
                key: c.key,
                label: lang === 'ar' ? c.labelAr : c.label,
                before: base.scores[c.key],
                after: s.scores[c.key],
                delta: +(s.scores[c.key] - base.scores[c.key]).toFixed(2),
              }))
                .filter(c => Math.abs(c.delta) > 0.01)
                .sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta))
                .slice(0, 2);

              if (changes.length === 0) return null;
              return (
                <div key={s.id} className="p-2.5 rounded-lg border border-line">
                  <div className="flex items-center gap-1.5 mb-1">
                    <span className="w-4 h-4 rounded text-[9px] font-bold text-white grid place-items-center" style={{ background: s.color }}>{s.id}</span>
                    <span className="text-[11px] font-semibold text-ink">{lang === 'ar' ? s.nameAr : s.name}</span>
                  </div>
                  <div className="text-[10px] text-muted leading-relaxed">
                    {changes.map(c => (
                      <span key={c.key} className="inline-flex items-center gap-1 me-2">
                        <span className="font-medium text-ink">{c.label}</span>
                        <span className="text-muted">{c.before} → {c.after}</span>
                        <span className={c.delta > 0 ? 'text-secondary font-bold' : 'text-danger font-bold'}>
                          {c.delta > 0 ? '+' : ''}{c.delta}
                        </span>
                      </span>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ============================================================
   ECONOMIC PLANNER
============================================================ */
function EconomicsPage({ field }) {
  const { t, lang } = useT();
  const [scenario, setScenario] = useState('baseline');
  const assumptions = {
    conservative: { yield: 5.2, price: 220, seed: 3200, fert: 4100, irrig: 2600, other: 1800 },
    baseline: { yield: 6.1, price: 260, seed: 2900, fert: 3700, irrig: 2200, other: 1600 },
    optimistic: { yield: 7.0, price: 300, seed: 2700, fert: 3400, irrig: 1900, other: 1500 },
  };
  const a = assumptions[scenario];
  const revenue = a.yield * a.price;
  const totalCost = a.seed + a.fert + a.irrig + a.other;
  const net = revenue - totalCost;
  const fieldHa = field?.areaHa || 1;
  const fieldNet = Math.round(net * fieldHa);

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div>
        <h2 className="text-xl md:text-2xl font-extrabold text-ink">{t('nav.economics')}</h2>
        <p className="text-sm text-muted mt-0.5 max-w-2xl">
          {lang === 'ar' ? 'تقديرات التكلفة والإيرادات بناءً على افتراضات توضيحية، وليست نتائج مالية مضمونة.' : 'Cost and revenue estimates based on illustrative assumptions — not guaranteed financial results.'}
        </p>
      </div>

      {field && <Card className="p-3"><FieldContextBar field={field} /></Card>}

      <div className="grid md:grid-cols-3 gap-3">
        {['conservative', 'baseline', 'optimistic'].map(s => {
          const sa = assumptions[s];
          const sNet = (sa.yield * sa.price) - (sa.seed + sa.fert + sa.irrig + sa.other);
          return (
            <button key={s} onClick={() => setScenario(s)}
              className={`text-start p-4 rounded-2xl border transition-all ${scenario === s ? 'bg-forest text-white border-forest shadow-lift' : 'bg-white border-line hover:border-secondary'}`}>
              <div className={`text-[10px] uppercase font-bold tracking-wide ${scenario === s ? 'text-sage' : 'text-muted'}`}>
                {lang === 'ar' ? ({ conservative: 'متحفظ', baseline: 'أساسي', optimistic: 'متفائل' })[s] : s}
              </div>
              <div className={`text-2xl font-extrabold mt-1 ${scenario === s ? 'text-white' : 'text-ink'}`}>
                {sNet.toLocaleString()}
                <span className={`text-[10px] font-medium ${scenario === s ? 'text-sage' : 'text-muted'}`}> EGP/ha</span>
              </div>
              <div className={`text-[10px] mt-1 ${scenario === s ? 'text-sage' : 'text-muted'}`}>{lang === 'ar' ? 'صافي العائد التقديري' : 'Estimated net return'}</div>
            </button>
          );
        })}
      </div>

      <div className="grid lg:grid-cols-2 gap-4">
        <Card className="p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{lang === 'ar' ? 'تفصيل التكاليف' : 'Cost Breakdown'}</h3>
          <div className="space-y-2 text-[12px]">
            {[
              [lang === 'ar' ? 'البذور' : 'Seeds', a.seed],
              [lang === 'ar' ? 'الأسمدة' : 'Fertilizer', a.fert],
              [lang === 'ar' ? 'الري' : 'Irrigation', a.irrig],
              [lang === 'ar' ? 'أخرى' : 'Other inputs', a.other],
            ].map(([k, v]) => (
              <div key={k}>
                <div className="flex justify-between mb-1"><span className="text-muted">{k}</span><span className="font-bold text-ink">{v.toLocaleString()}</span></div>
                <div className="h-1.5 rounded-full bg-lightsage overflow-hidden"><div className="h-full bg-secondary rounded-full" style={{ width: (v / totalCost * 100) + '%' }} /></div>
              </div>
            ))}
            <div className="pt-2 border-t border-line flex justify-between font-bold text-ink">
              <span>{lang === 'ar' ? 'إجمالي التكلفة' : 'Total cost'}</span><span>{totalCost.toLocaleString()}</span>
            </div>
          </div>
        </Card>
        <Card className="p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{lang === 'ar' ? 'الإيرادات والصافي' : 'Revenue & Net'}</h3>
          <div className="space-y-2 text-[12px]">
            <div className="flex justify-between"><span className="text-muted">{lang === 'ar' ? 'الإنتاج المتوقع' : 'Expected yield'}</span><span className="font-bold">{a.yield} t/ha</span></div>
            <div className="flex justify-between"><span className="text-muted">{lang === 'ar' ? 'سعر السوق' : 'Market price'}</span><span className="font-bold">{a.price} EGP/t</span></div>
            <div className="flex justify-between"><span className="text-muted">{lang === 'ar' ? 'الإيرادات' : 'Revenue'}</span><span className="font-bold">{revenue.toLocaleString()}</span></div>
            <div className="pt-2 border-t border-line flex justify-between text-base font-extrabold text-forest">
              <span>{lang === 'ar' ? 'صافي العائد' : 'Net return'}</span><span>{net.toLocaleString()}</span>
            </div>
            {field && (
              <div className="flex justify-between text-[11px] text-muted">
                <span>{lang === 'ar' ? 'على مستوى الحقل' : 'Field-level net'} ({field.areaHa} ha)</span>
                <span className="font-semibold text-forest">{fieldNet.toLocaleString()} EGP</span>
              </div>
            )}
          </div>
          <div className="mt-3 p-2.5 rounded-lg bg-warn/10 border border-warn/30 text-[10px] text-warn flex items-start gap-1.5">
            <Icon name="alert" size={11} className="shrink-0 mt-0.5" />
            {lang === 'ar' ? 'افتراضات توضيحية فقط — غير مضمونة.' : 'Illustrative assumptions only — not guaranteed.'}
          </div>
        </Card>
      </div>
    </div>
  );
}

              [lang === 'ar' ? 'الري والتربة' : 'Irrigation & soil', field ? `${lang === 'ar' ? field.irrigationAr : field.irrigation} · ${lang === 'ar' ? field.soilAr : field.soil}` : '—'],
              [lang === 'ar' ? 'الاستراتيجية المقترحة' : 'Proposed strategy', top ? `${top.id} · ${lang === 'ar' ? top.nameAr : top.name}` : t('common.none')],
              [lang === 'ar' ? 'الملاءمة' : 'Suitability', top ? `${top.total.toFixed(2)} / 10` : '—'],
              [lang === 'ar' ? 'الثقة' : 'Confidence', top ? `${Math.round(top.confidence * 100)}%` : '—'],
              [lang === 'ar' ? 'قيود البيانات' : 'Data limitations', lang === 'ar' ? 'لا توجد قياسات تربة موثقة؛ رطوبة التربة بدقة 9 كم' : 'No verified soil tests; soil moisture at ~9 km resolution'],
            ].map(([k, v]) => (
              <div key={k} className="flex justify-between gap-2 py-1.5 border-b border-line last:border-0">
                <span className="text-muted">{k}</span><span className="font-semibold text-ink text-end">{v}</span>
              </div>
            ))}
          </div>
        </Card>

        <Card className="p-4">
          <h3 className="font-bold text-ink text-sm mb-3">{lang === 'ar' ? 'حالة المراجعة' : 'Review Status'}</h3>
          <div className="space-y-1.5 mb-3">
            {statuses.map(s => (
              <button key={s.k} onClick={() => setStatus(s.k)}
                className={`w-full flex items-center gap-2 p-2 rounded-lg border text-start text-[11px] transition-colors ${status === s.k ? 'border-secondary bg-lightsage/60 font-bold' : 'border-line hover:bg-lightsage/30'}`}>
                <span className={`w-2 h-2 rounded-full ${status === s.k ? 'bg-secondary' : 'bg-line'}`} />

              </button>
            ))}
          </div>
          <label className="block">
            <span className="text-[10px] uppercase font-bold text-muted">{lang === 'ar' ? 'ملاحظات الخبير' : 'Expert comments'}</span>

              className="w-full mt-1 px-2.5 py-2 text-xs border border-line rounded-lg focus:outline-none focus:border-secondary resize-none"
              placeholder={lang === 'ar' ? 'أضف ملاحظات المراجعة…' : 'Add review comments…'} />

          <Button size="sm" className="w-full mt-2" icon="check">{lang === 'ar' ? 'حفظ المراجعة' : 'Save Review'}</Button>

}

/* ============================================================
   DECISION REPORTS
============================================================ */
function ReportsPage({ farms, activeFarmId, field, goals, constraints, simulation }) {
  const { t, lang } = useT();
  const farm = farms.find(f => f.id === activeFarmId) || farms[0];
  const weights = useMemo(() => computeWeights(goals), [goals]);
  const ranked = useMemo(() => evaluateStrategies(field, weights, constraints, null), [field, weights, constraints]);
  const rankedWithSim = useMemo(() => evaluateStrategies(field, weights, constraints, simulation), [field, weights, constraints, simulation]);
  const top = ranked.find(s => s.feasible);
  const env = useMemo(() => envForField(field), [field]);
  const date = new Date().toISOString().slice(0, 10);
  const hasSim = Object.values(simulation).some(v => v !== 0);

  const sections = [
    [lang === 'ar' ? 'معلومات المزرعة' : 'Farm Information', `${lang === 'ar' ? farm.nameAr : farm.name} · ${lang === 'ar' ? farm.locationAr : farm.location}`],
    [lang === 'ar' ? 'الحقل المحدد' : 'Selected Field', field ? `${lang === 'ar' ? field.nameAr : field.name} · ${field.areaHa} ha · ${lang === 'ar' ? field.cropAr : field.crop} · ${lang === 'ar' ? field.seasonAr : field.season}` : t('common.noField')],
    [lang === 'ar' ? 'حدود الحقول' : 'Field Boundaries', field ? `${field.coords.length} ${lang === 'ar' ? 'رأس' : 'vertices'} · ${field.areaHa} ha` : '—'],
    [lang === 'ar' ? 'النظرة البيئية' : 'Environmental Overview', field
      ? (lang === 'ar'
        ? `حرارة ${env.temperature.headline}°م · أمطار ${env.rainfall.headline}مم · رطوبة ${env.soil.headline} · NDVI ${env.ndvi.headline}`
        : `Temp ${env.temperature.headline}°C · Rain ${env.rainfall.headline} mm · Soil ${env.soil.headline} m³/m³ · NDVI ${env.ndvi.headline}`)
      : '—'],
    [lang === 'ar' ? 'مصادر البيانات' : 'Data Sources', 'NASA POWER · GPM IMERG · SMAP · MODIS · Landsat (demo labels only)'],
    [lang === 'ar' ? 'أهداف المزارع' : 'Farmer Goals', GOAL_DEFS.filter(g => goals[g.key] > 0).map(g => `${lang === 'ar' ? g.labelAr : g.label} (${goals[g.key]}%)`).join(' · ') || t('common.none')],
    [lang === 'ar' ? 'القيود المختارة' : 'Selected Constraints', CONSTRAINTS_DEF.filter(c => constraints[c.key]).map(c => lang === 'ar' ? c.labelAr : c.label).join(' · ') || t('common.none')],
    [lang === 'ar' ? 'مقارنة الاستراتيجيات' : 'Strategy Comparison', ranked.map(s => `${s.id}${s.feasible ? '' : ' ⚠'}: ${s.total.toFixed(2)}`).join(' · ')],
    [lang === 'ar' ? 'الاستراتيجية الموصى بها' : 'Recommended Strategy', top ? `${top.id} · ${lang === 'ar' ? top.nameAr : top.name} (${top.total.toFixed(2)}/10)` : t('strategy.noFeasible')],
    [lang === 'ar' ? 'شرح التقييم' : 'Scoring Explanation', lang === 'ar'
      ? 'الأوزان مشتقة من أولويات المزارع ومطبَّعة إلى 100%. الاستراتيجيات التي تنتهك القيود الصارمة لا تُرتَّب.'
      : 'Weights derived from farmer priorities and normalized to 100%. Strategies violating hard constraints are not ranked.'],
    [lang === 'ar' ? 'تقييم الثقة' : 'Confidence Assessment', ranked.map(s => `${s.id}: ${Math.round(s.confidence * 100)}%`).join(' · ')],
    [lang === 'ar' ? 'المخاطر البيئية' : 'Environmental Risks', lang === 'ar' ? 'محدودية المياه · جودة بيانات التربة' : 'Water availability · soil data quality'],
    [lang === 'ar' ? 'قيود البيانات' : 'Data Limitations', lang === 'ar' ? 'دقة رطوبة التربة ~9 كم · لا توجد فحوص تربة موثقة' : 'Soil moisture ~9 km resolution · no verified soil tests'],
    [lang === 'ar' ? 'حالة مراجعة الخبير' : 'Agronomist Review Status', lang === 'ar' ? 'قيد الانتظار — مطلوب مراجعة' : 'Pending Review — required'],
  ];

  if (hasSim) {
    sections.push([lang === 'ar' ? 'سيناريو المحاكاة' : 'Simulation Scenario', Object.entries(simulation).filter(([, v]) => v !== 0).map(([k, v]) => `${k}: ${v > 0 ? '+' : ''}${v}`).join(' · ')]);
    sections.push([lang === 'ar' ? 'ترتيب المحاكاة' : 'Simulated Ranking', rankedWithSim.map(s => `${s.id}${s.feasible ? '' : ' ⚠'}: ${s.total.toFixed(2)}`).join(' · ')]);
  }

  sections.push([lang === 'ar' ? 'الملخص النهائي' : 'Final Decision Summary',
    top
      ? (lang === 'ar'
        ? `الاستراتيجية الأعلى ترتيبًا هي ${top.nameAr} بدرجة ${top.total.toFixed(2)}/10 بثقة ${Math.round(top.confidence * 100)}%.`
        : `Top ranked strategy: ${top.name} at ${top.total.toFixed(2)}/10 with ${Math.round(top.confidence * 100)}% confidence.`)
      : t('strategy.noFeasible')
  ]);

  return (
    <div className="p-4 md:p-6 space-y-4">
      <div className="no-print flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 className="text-xl md:text-2xl font-extrabold text-ink">{t('reports.title')}</h2>
          <p className="text-sm text-muted mt-0.5 max-w-2xl">{t('reports.sub')}</p>
        </div>
        <div className="flex gap-2">
          <Button variant="outline" size="sm" icon="printer" onClick={() => window.print()}>{t('action.print')}</Button>
          <Button size="sm" icon="download" onClick={() => window.print()}>{t('action.download')}</Button>
        </div>
      </div>

      <Card className="print-page p-6 md:p-8">
        <div className="flex items-start justify-between pb-4 border-b border-line mb-5">
          <div className="flex items-center gap-2.5">
            <div className="w-10 h-10 rounded-lg bg-forest text-white grid place-items-center font-extrabold">S</div>
            <div>
              <div className="font-extrabold text-forest text-sm tracking-wide">{t('brand')}</div>
              <div className="text-[9px] tracking-[0.2em] text-muted font-bold">{t('brandSub')}</div>
            </div>
          </div>
          <div className="text-end">
            <div className="text-[10px] uppercase font-bold text-muted">{t('reports.generated')}</div>
            <div className="text-xs font-semibold text-ink">{date}</div>
            <div className="mt-1"><DataBadge small /></div>
          </div>
        </div>

        <h1 className="text-xl md:text-2xl font-extrabold text-ink mb-1">
          {lang === 'ar' ? 'تقرير قرار زراعي' : 'Agricultural Decision Report'}
        </h1>
        <p className="text-sm text-muted mb-2">
          {lang === 'ar' ? farm.nameAr : farm.name} · {lang === 'ar' ? farm.locationAr : farm.location}
          {field && <> · {lang === 'ar' ? field.nameAr : field.name}</>}
        </p>

        <div className="grid sm:grid-cols-3 gap-3 mb-6">
          {[
            [t('strategy.suitability'), top ? top.total.toFixed(2) + '/10' : '—'],
            [t('strategy.confidence'), top ? Math.round(top.confidence * 100) + '%' : '—'],
            [t('reports.farm'), top ? (lang === 'ar' ? top.nameAr : top.name) : t('strategy.noFeasible')],
          ].map(([k, v]) => (
            <div key={k} className="p-3 rounded-lg bg-lightsage/60">
              <div className="text-[9px] uppercase font-bold text-muted tracking-wide">{k}</div>
              <div className="text-sm font-bold text-forest mt-0.5">{v}</div>
            </div>
          ))}
        </div>

        <h2 className="text-sm font-extrabold text-ink mb-3 pb-1.5 border-b border-line">{t('reports.sections')}</h2>
        <div className="space-y-2">
          {sections.map(([title, body], i) => (
            <div key={i} className="grid grid-cols-12 gap-3 py-2 border-b border-line last:border-0">
              <div className="col-span-1 text-[11px] font-bold text-sage">{String(i + 1).padStart(2, '0')}</div>
              <div className="col-span-4 text-[11px] font-bold text-ink">{title}</div>
              <div className="col-span-7 text-[11px] text-muted leading-relaxed">{body}</div>
            </div>
          ))}
        </div>

        <div className="mt-6 p-3 rounded-lg bg-warn/10 border border-warn/30 text-[10px] text-warn flex items-start gap-2">
          <Icon name="alert" size={13} className="shrink-0 mt-0.5" />
          {lang === 'ar'
            ? 'هذا التقرير توضيحي ولا يمثل توصية علمية معتمدة. جميع البيانات تجريبية ولا تعكس أرصادًا حية. يجب إجراء فحص تربة ومراجعة خبير زراعي قبل التطبيق.'
            : 'This report is illustrative and does not constitute an endorsed scientific recommendation. All data is demo data and does not reflect live observations. Soil testing and expert agronomist review are required before application.'}
        </div>
      </Card>
    </div>
  );
}

/* ============================================================
   APP SHELL
============================================================ */
const PAGE_TITLES = {
  dashboard: 'nav.overview', farms: 'nav.farms', mapping: 'nav.mapping', intel: 'nav.intel',
  goals: 'nav.goals', strategy: 'nav.strategy', simulator: 'nav.simulator', economics: 'nav.economics',
  review: 'nav.review', reports: 'nav.reports', settings: 'nav.settings',
};

function App() {
  const [lang, setLang] = useState('en');
  const [route, setRoute] = useState('landing');
  const [role, setRole] = useState('farmer');
  const [farms, setFarms] = useState(FARMS_SEED);
  const [fields, setFields] = useState(FIELDS_SEED);
  const [activeFarmId, setActiveFarmId] = useState('farm-qalyubia');
  const [activeFieldId, setActiveFieldId] = useState('fld-a');
  const [goals, setGoals] = useState({ yield: 17, water: 17, soil: 17, profit: 17, resilience: 16, inputs: 16 });
  const [constraints, setConstraints] = useState({ water: true, budget: false, crop: false, irrigation: false, equipment: false });
  const [simulation, setSimulation] = useState({ temp: 0, rain: 0, water: 0, inputPrice: 0, marketPrice: 0 });
  const [sidebarOpen, setSidebarOpen] = useState(false);

  useEffect(() => { window.__setLang = setLang; }, []);
  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  }, [lang]);

  // Sync field selection when farm changes
  useEffect(() => {
    const farmFields = fields.filter(f => f.farmId === activeFarmId);
    if (!farmFields.find(f => f.id === activeFieldId) && farmFields.length > 0) {
      setActiveFieldId(farmFields[0].id);
    } else if (farmFields.length === 0) {
      setActiveFieldId(null);
    }
  }, [activeFarmId, fields, activeFieldId]);

  const activeField = fields.find(f => f.id === activeFieldId) || null;
  const activeFarm = farms.find(f => f.id === activeFarmId);

  const { t, dir } = useT();

  const pageTitle = useMemo(() => PAGE_TITLES[route] ? t(PAGE_TITLES[route]) : t('brand'), [route, lang]);

  let content;
  switch (route) {
    case 'landing':
      content = <LandingPage setRoute={setRoute} seedFields={fields.filter(f => f.farmId === 'farm-qalyubia')} />;
      break;
    case 'dashboard':
      content = <DashboardPage setRoute={setRoute} farms={farms} fields={fields} activeFarmId={activeFarmId}
        activeField={activeField} role={role} goals={goals} constraints={constraints} />;
      break;
    case 'farms':
      content = <FarmsPage farms={farms} fields={fields} setFarms={setFarms}
        activeFarmId={activeFarmId} setActiveFarmId={setActiveFarmId}
        setActiveFieldId={setActiveFieldId} setRoute={setRoute} />;
      break;
    case 'mapping':
      content = <MappingPage farms={farms} fields={fields} setFields={setFields}
        activeFarmId={activeFarmId} activeField={activeField}
        setActiveFieldId={setActiveFieldId} setRoute={setRoute} />;
      break;
    case 'intel':
      content = <IntelPage field={activeField} farm={activeFarm} />;
      break;
    case 'goals':
      content = <GoalsPage goals={goals} setGoals={setGoals} constraints={constraints} setConstraints={setConstraints} setRoute={setRoute} />;
      break;
    case 'strategy':
      content = <StrategyPage field={activeField} goals={goals} constraints={constraints} />;
      break;
    case 'simulator':
      content = <SimulatorPage field={activeField} goals={goals} constraints={constraints}
        simulation={simulation} setSimulation={setSimulation} />;
      break;
    case 'economics':
      content = <EconomicsPage field={activeField} />;
      break;
    case 'review':
      content = <ReviewPage field={activeField} goals={goals} constraints={constraints} />;
      break;
    case 'reports':
      content = <ReportsPage farms={farms} activeFarmId={activeFarmId} field={activeField}
        goals={goals} constraints={constraints} simulation={simulation} />;
      break;
    case 'settings':
      content = <SettingsPage lang={lang} setLang={setLang} />;
      break;
    default:
      content = <DashboardPage setRoute={setRoute} farms={farms} fields={fields} activeFarmId={activeFarmId}
        activeField={activeField} role={role} goals={goals} constraints={constraints} />;
  }

  const isLanding = route === 'landing';

  return (
    <LangProvider lang={lang}>
      <div dir={dir} className="min-h-screen bg-canvas">
        {isLanding ? content : (
          <div className="flex min-h-screen">
            <Sidebar route={route} setRoute={setRoute} role={role} setRole={setRole} open={sidebarOpen} setOpen={setSidebarOpen} />
            <div className="flex-1 min-w-0 flex flex-col">
              <Topbar
                farms={farms} fields={fields}
                activeFarmId={activeFarmId} activeFieldId={activeFieldId}
                setActiveFarmId={setActiveFarmId} setActiveFieldId={setActiveFieldId}
                lang={lang} setLang={setLang} setOpen={setSidebarOpen} title={pageTitle} />
              <main className="flex-1 min-w-0">{content}</main>
              <footer className="no-print px-4 md:px-6 py-4 border-t border-line text-[10px] text-muted flex flex-wrap items-center justify-between gap-2">
                <span>© 2025 SOLDOC Virtual Farm — concept demo, not for production agricultural use.</span>
                <DataBadge small />
              </footer>
            </div>
          </div>
        )}
      </div>
    </LangProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
